version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: minierp_postgres
    restart: always
    environment:
      POSTGRES_USER: erpuser
      POSTGRES_PASSWORD: erppassword123
      POSTGRES_DB: minierp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: minierp_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://erpuser:erppassword123@postgres:5432/minierp_db?schema=public"
      JWT_SECRET: "docker-secure-mini-erp-key-2026"
      JWT_EXPIRES_IN: "1d"
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: minierp_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: